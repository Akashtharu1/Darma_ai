<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DermAI Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        body { background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { background: white; padding: 40px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); width: 100%; max-width: 450px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 500; margin-bottom: 24px; }
        .auth-title { text-align: center; margin-bottom: 8px; color: var(--secondary); font-size: 1.8rem; }
        .auth-subtitle { text-align: center; color: var(--text-light); font-size: 0.9rem; margin-bottom: 30px; }
        
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 24px; }
        .auth-tab { flex: 1; text-align: center; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .auth-tab.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        .auth-tab svg { width: 18px; height: 18px; }
        
        .form-group { margin-bottom: 16px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; color: var(--secondary); }
        .input-icon { position: absolute; left: 12px; top: 38px; color: var(--text-light); }
        .form-control { width: 100%; padding: 12px 12px 12px 38px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.9rem; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        
        .form-options { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-size: 0.85rem; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .form-options a { color: var(--primary); text-decoration: none; }
        
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-light); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .error-msg { color: var(--danger); font-size: 0.85rem; margin-bottom: 15px; padding: 10px; background: var(--danger-light); border-radius: var(--radius-sm); }
        .success-msg { color: var(--success); font-size: 0.85rem; margin-bottom: 15px; padding: 10px; background: #dcfce7; border-radius: var(--radius-sm); }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="/" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Home
        </a>
        
        <h2 class="auth-title">Welcome Back!</h2>
        <p class="auth-subtitle">Login to access your account</p>
        
        <div class="auth-tabs">
            <div class="auth-tab {% if tab == 'user' %}active{% endif %}" id="tabUser" onclick="switchTab('user')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                User Login
            </div>
            <div class="auth-tab {% if tab == 'admin' %}active{% endif %}" id="tabAdmin" onclick="switchTab('admin')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Admin Login
            </div>
        </div>

        {% if request.args.get('signup') == 'success' %}
        <div class="success-msg">Account created successfully! Please login.</div>
        {% endif %}

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="tab" id="tabInput" value="{{ tab }}">
            <div class="form-group">
                <label>Email Address</label>
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <input type="email" name="email" class="form-control" placeholder="Enter your email address" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="form-options">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px; vertical-align:middle;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                Login
            </button>
        </form>
        
        <div class="auth-footer" id="signupLinkDiv" {% if tab == 'admin' %}style="display:none"{% endif %}>
            Don't have an account? <a href="/signup">Sign up</a>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('tabInput').value = tab;
            if (tab === 'admin') {
                document.getElementById('tabAdmin').classList.add('active');
                document.getElementById('tabUser').classList.remove('active');
                document.getElementById('signupLinkDiv').style.display = 'none';
            } else {
                document.getElementById('tabUser').classList.add('active');
                document.getElementById('tabAdmin').classList.remove('active');
                document.getElementById('signupLinkDiv').style.display = 'block';
            }
        }
    </script>
</body>
</html>
